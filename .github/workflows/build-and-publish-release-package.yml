name: Build and publish release package

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PKG: local-rag-${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the pinned images exist
        run: |
          set -a; source .env.example; set +a
          docker manifest inspect ghcr.io/$GHCR_OWNER/local-rag-backend:$BACKEND_TAG > /dev/null
          docker manifest inspect ghcr.io/$GHCR_OWNER/local-rag-ui:$UI_TAG > /dev/null

      - name: Build the package
        run: |
          mkdir $PKG
          cp docker-compose.yml .env.example Makefile README.md $PKG/
          zip -r $PKG.zip $PKG
          tar -czf $PKG.tar.gz $PKG
          sha256sum $PKG.zip $PKG.tar.gz > checksums.txt

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            $PKG.zip $PKG.tar.gz checksums.txt \
            --title "$GITHUB_REF_NAME" --generate-notes
